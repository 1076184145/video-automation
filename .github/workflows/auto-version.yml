name: Auto Version & Release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  auto-release:
    name: Auto Version & Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: auto-version-main
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check tested commit is current
        id: source
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'continue=false' >> "$GITHUB_OUTPUT"
          elif [[ "$(git log -1 --format=%s)" == "chore: bump version to "* ]]; then
            echo 'continue=false' >> "$GITHUB_OUTPUT"
          else
            echo 'continue=true' >> "$GITHUB_OUTPUT"
          fi
      
      - name: Configure git
        if: steps.source.outputs.continue == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get latest version
        if: steps.source.outputs.continue == 'true'
        id: version
        run: |
          # Import the package version so __all__ or comments cannot become
          # extra lines in the GitHub Actions output file.
          CURRENT_VERSION=$(python -c 'from video_automation import __version__; print(__version__)')
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: $CURRENT_VERSION" >&2
            exit 1
          fi
          printf 'current_version=%s\n' "$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          
          # 获取最后一次 release 标签
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          printf 'latest_tag=%s\n' "$LATEST_TAG" >> "$GITHUB_OUTPUT"
          
          # 检查是否有未发布的提交
          COMMITS_SINCE=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || git rev-list --count HEAD)
          printf 'commits_since=%s\n' "$COMMITS_SINCE" >> "$GITHUB_OUTPUT"
      
      - name: Calculate new version
        if: steps.source.outputs.continue == 'true'
        id: new_version
        run: |
          CURRENT=${{ steps.version.outputs.current_version }}
          COMMITS=${{ steps.version.outputs.commits_since }}
          
          # 如果有新的提交且版本未更新，则自动增加补丁版本
          if [ "$COMMITS" -gt 0 ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "should_update=true" >> $GITHUB_OUTPUT
          else
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
            echo "should_update=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update version
        if: steps.source.outputs.continue == 'true' && steps.new_version.outputs.should_update == 'true'
        run: |
          NEW_VERSION=${{ steps.new_version.outputs.version }}
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" video_automation/__init__.py
          
          # 提交版本更新
          git add video_automation/__init__.py
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin HEAD:main
      
      - name: Create release tag
        if: steps.source.outputs.continue == 'true'
        id: release_tag
        run: |
          VERSION=${{ steps.new_version.outputs.version }}
          TAG="v${VERSION}"
          
          # 检查标签是否存在
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            printf 'created=false\n' >> "$GITHUB_OUTPUT"
          else
            # 创建标签（使用最新提交）
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
            printf 'created=true\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      # Tag pushes made with GITHUB_TOKEN do not trigger another workflow.
      # workflow_dispatch is an explicit exception supported by GitHub Actions.
      - name: Dispatch desktop release build
        if: steps.release_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"
